[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemeleon-dng"
version = "0.1.0"
description = "Chemeleon for De Novo Generation - A framework for crystal structure generation and prediction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Chemeleon-DNG Contributors"}
]
keywords = ["machine learning", "crystal structure", "diffusion models", "materials science", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10", 
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "torch>=2.1.0",
    "pytorch-lightning>=2.1.0",
    "sacred",
    "ase>=3.20.0",
    "torch-geometric",
    "torchmetrics",
    "tqdm",
    "wandb",
    "pydantic>=2.0.0",
    "pymatgen>=2023.1.1",
    "fire",
    # Ensure compatible versions for scientific computing stack
    "numpy>=1.21.0,<2.0",
    "scipy>=1.7.0",
    "numba>=0.57.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
]

notebooks = [
    "jupyterlab",
    "matplotlib",
    "seaborn",
    "plotly",
]

test = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-xdist",
]

docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
]

# For users who want minimal dependencies (avoiding pymatgen)
minimal = [
    "torch>=2.1.0",
    "pytorch-lightning>=2.1.0",
    "ase>=3.20.0",
    "torch-geometric",
    "pydantic>=2.0.0",
    "fire",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/diffractive/chemeleon-dng"
Repository = "https://github.com/diffractive/chemeleon-dng"
Issues = "https://github.com/diffractive/chemeleon-dng/issues"
Documentation = "https://github.com/diffractive/chemeleon-dng#readme"

[project.scripts]
chemeleon-sample = "chemeleon_dng.sample:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chemeleon_dng*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
chemeleon_dng = ["*.yaml", "*.yml", "*.json", "*.txt"]

# Black formatting
[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort import sorting
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["chemeleon_dng"]

# pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=chemeleon_dng",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# mypy type checking
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "ase.*",
    "pymatgen.*",
    "torch_geometric.*",
    "sacred.*",
    "wandb.*",
    "fire.*",
    "pytorch_lightning.*",
]
ignore_missing_imports = true

# Coverage configuration
[tool.coverage.run]
source = ["chemeleon_dng"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]
